<main id="main" class="wrap page explorer">
  <header class="sec-head explorer-head" id="top">
    <h1 id="explorer-task-name">Tasks</h1>
    <span class="explorer-pos" id="explorer-task-position"></span>
  </header>
  <div class="explorer-controls">
    <label>Task <select id="task-picker" aria-label="Choose a task"></select></label>
    <label>Model <select id="model-picker" aria-label="Choose a model"></select></label>
    <label id="context-control" hidden>Run <select id="context-picker" aria-label="Choose a recorded run"></select></label>
  </div>
  <p id="task-selection-notice" class="table-note" role="status" hidden></p>
  <div class="task-results-wrap" id="task-results"></div>
  <p id="task-record-summary" class="task-record-summary"></p>

  <div class="tabs task-content-tabs" role="tablist" aria-label="Task view">
    <button type="button" id="task-tab-website" role="tab" aria-selected="true" aria-controls="task-website" data-task-panel="website">Screenshots</button>
    <button type="button" id="task-tab-trajectory" role="tab" aria-selected="false" aria-controls="trajectory-panel" data-task-panel="trajectory" tabindex="-1">Trajectory</button>
  </div>
  <div id="task-website" role="tabpanel" aria-labelledby="task-tab-website">
    <div class="comparison-tools">
      <form id="comparison-route-form" class="replay-only" hidden><label for="comparison-route" class="sr-only">Page path on both websites</label><span aria-hidden="true">↳</span><input id="comparison-route" value="/" placeholder="/page" autocomplete="off" spellcheck="false"><button type="submit">Go</button></form>
      <label class="compact-check replay-only" hidden><input type="checkbox" id="sync-scroll" checked>Sync scroll</label>
      <label class="compact-check replay-only" hidden><input type="checkbox" id="sync-navigation">Sync navigation</label>
      <div id="preview-mode-control" class="preview-mode" hidden><button type="button" data-preview-mode="interactive" aria-pressed="false">Interactive</button><button type="button" data-preview-mode="screenshot" aria-pressed="true">Screenshot</button></div>
      <label id="state-control" class="preview-state" hidden>Page <select id="state-picker" aria-label="Choose a page"></select></label>
      <select id="comparison-layout" aria-label="Comparison layout"><option value="stacked">Top / bottom</option><option value="side">Side by side</option></select>
      <button type="button" id="reset-preview" class="replay-only" title="Restart both websites with fresh state" hidden>Reset</button>
    </div>
    <div id="comparison-empty" class="comparison-empty" hidden>
      <p id="comparison-empty-message"></p>
      <button id="start-preview" type="button" class="btn btn-sm" hidden>Start interactive comparison</button>
      <button id="open-task-trace" type="button" class="link-btn" hidden>View trajectory <span aria-hidden="true">→</span></button>
      <button id="show-example" type="button" class="link-btn" hidden>See the screenshot example: Medium, Qwen 3.8 Max <span aria-hidden="true">→</span></button>
    </div>
    <div class="comparison-stage" hidden>
      <section class="comparison-pane" aria-labelledby="reference-heading"><header><h2 id="reference-heading">Reference</h2><span id="reference-version"></span><a id="reference-live-link" target="_blank" rel="noopener noreferrer" hidden aria-label="Open the reference at full size">↗</a></header><div id="reference-preview" class="comparison-preview"></div></section>
      <section class="comparison-pane" aria-labelledby="candidate-heading"><header><h2 id="candidate-heading">Rebuild</h2><span id="candidate-model-name"></span><a id="candidate-live-link" target="_blank" rel="noopener noreferrer" hidden aria-label="Open the rebuild at full size">↗</a></header><div id="candidate-preview" class="comparison-preview"></div></section>
    </div>
  </div>
  <section id="trajectory-panel" class="trajectory-viewer" role="tabpanel" aria-labelledby="task-tab-trajectory" hidden>
    <div class="trace-toolbar"><label id="trace-run-control" hidden>Run <select id="trace-run" aria-label="Choose a recorded trajectory"></select></label><label id="trace-document-control" hidden>Agent <select id="trace-document" aria-label="Choose an embedded agent trajectory"></select></label><label class="trace-file-button">Open an ATIF file<input id="trace-file" type="file" accept=".json,.png,.jpg,.jpeg,.webp,.gif,.wav,.mp3,.ogg,.m4a" multiple><span class="sr-only">Choose one ATIF JSON file, optionally with its media files</span></label><span class="trace-local-note">Files stay in your browser.</span></div>
    <p id="trace-status" class="trace-status" role="status">Open an ATIF trajectory file (JSON) to read it step by step.</p>
    <div id="trace-run-details"></div>
    <div id="trace-content" hidden>
      <div class="trace-controls"><label class="trace-search-label"><span class="sr-only">Search trajectory messages, calls and results</span><input id="trace-search" type="search" placeholder="Search messages, calls, results…"></label><select id="trace-filter" aria-label="Filter trajectory steps"><option value="all">All steps</option><option value="tools">With tool calls</option><option value="agent">Agent</option><option value="user">User</option><option value="system">System</option></select><span id="trace-match-count"></span><div class="trace-step-controls"><button type="button" id="trace-previous" aria-label="Previous matching step">←</button><label>Step <input id="trace-step-number" type="number" min="1" step="1" aria-label="Go to trajectory step"></label><span id="trace-step-total"></span><button type="button" id="trace-next" aria-label="Next matching step">→</button></div></div>
      <div class="trace-layout"><nav id="trace-step-list" class="trace-step-list" aria-label="Trajectory steps"></nav><article id="trace-step-detail" class="trace-step-detail" aria-label="Selected trajectory step" tabindex="-1"></article></div>
    </div>
  </section>
  <div class="explorer-footer"><button type="button" class="btn btn-sm" id="previous-task"><span aria-hidden="true">←</span> Previous task</button><span id="preview-status" role="status"></span><button type="button" class="btn btn-sm" id="next-task">Next task <span aria-hidden="true">→</span></button></div>
  <noscript><p class="table-note">The task browser needs JavaScript. Per-task scores are also in <a href="data/waffle-overview.csv">data/waffle-overview.csv</a>.</p></noscript>
